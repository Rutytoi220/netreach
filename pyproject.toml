[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netreach"
version = "0.1.0"
description = "Fast, lightweight neural network engine for deep attack path reachability and lateral movement analysis in network security graphs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
netreach = "netreach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netreach*"]

[tool.setuptools.package-data]
netreach = ["assets/*.pt"]
